# TEMPORARY evidence probe for TASKS.md T-008 (session arena-0b9d98b4).
# Removed from the branch before merge; the run and its PR comment are the record.
# Run 2: resolves every href (no 10-link cap) so the docs-landing link check is exact.
#
# Question: do 62GEMSDOE, GEMSDOE42 and GEMSDOE44 — whose configured Pages source
# (main /) has no index.html — publish a usable landing page, and do the documentation
# sites their READMEs link (docs/index.html) actually serve? The audit sandbox cannot
# reach *.github.io, so the observation is made from this runner and posted as a PR
# comment (readable through api.github.com). One GET per URL, no JavaScript executed.
name: T-008 landing-page probe (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/t008-landing-probe.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Observe the landing pages and the linked documentation sites
        run: |
          python3 - <<'PY'
          import datetime, hashlib, html.parser, json, os, urllib.error, urllib.parse, urllib.request
          BASE = "https://buffedlizard55-lab.github.io/"
          URLS = [
              ("62GEMSDOE", "root", BASE + "62GEMSDOE/"),
              ("GEMSDOE42", "root", BASE + "GEMSDOE42/"),
              ("GEMSDOE42", "linked docs (README: docs/index.html)", BASE + "GEMSDOE42/docs/index.html"),
              ("GEMSDOE42", "docs directory", BASE + "GEMSDOE42/docs/"),
              ("GEMSDOE44", "root", BASE + "GEMSDOE44/"),
              ("GEMSDOE44", "linked docs (README: docs/index.html)", BASE + "GEMSDOE44/docs/index.html"),
              ("GEMSDOE44", "docs directory", BASE + "GEMSDOE44/docs/"),
          ]

          class Page(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.title, self.h1, self.generator, self.hrefs = None, None, None, []
                  self._in = None; self._buf = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag in ("title", "h1") and getattr(self, tag) is None and self._in is None:
                      self._in, self._buf = tag, []
                  if tag == "meta" and (a.get("name") or "").lower() == "generator":
                      self.generator = a.get("content")
                  if tag == "a" and a.get("href"):
                      self.hrefs.append(a["href"])
              def handle_endtag(self, tag):
                  if tag == self._in:
                      setattr(self, tag, " ".join("".join(self._buf).split()))
                      self._in = None
              def handle_data(self, data):
                  if self._in:
                      self._buf.append(data)

          rows = []
          for repo, role, url in URLS:
              row = {"repo": repo, "role": role, "url": url,
                     "checkedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}
              req = urllib.request.Request(url, headers={"User-Agent": "MasterSite-T008-probe"})
              body = b""
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      row.update(status=r.status, finalUrl=r.geturl(), contentType=r.headers.get("Content-Type"),
                                 lastModified=r.headers.get("Last-Modified"), requestId=r.headers.get("X-GitHub-Request-Id"))
                      body = r.read(4 * 1024 * 1024)
              except urllib.error.HTTPError as e:
                  row.update(status=e.code, finalUrl=e.geturl(), contentType=e.headers.get("Content-Type"),
                             lastModified=e.headers.get("Last-Modified"), requestId=e.headers.get("X-GitHub-Request-Id"))
                  body = e.read(4 * 1024 * 1024) or b""
              except Exception as e:  # transport failure: recorded, never read as "site down"
                  row.update(status=None, error="%s: %s" % (type(e).__name__, e))
              p = Page(); p.feed(body.decode("utf-8", "replace"))
              # Resolve every href against the served URL (no truncation), then test whether the
              # page links the repository's documentation landing page itself.
              resolved = sorted(set(urllib.parse.urljoin(row.get("finalUrl") or url, h).split("#")[0] for h in p.hrefs))
              docs_targets = {BASE + repo + "/docs/index.html", BASE + repo + "/docs/"}
              row.update(bytes=len(body), sha256=hashlib.sha256(body).hexdigest() if body else None,
                         title=p.title, h1=p.h1, generator=p.generator, linkCount=len(p.hrefs),
                         docsLinks=[u for u in resolved if "/docs/" in u],
                         linksDocsLanding=any(u in docs_targets for u in resolved))
              rows.append(row)

          run_url = "%s/%s/actions/runs/%s" % (os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"])
          md = ["<!-- t008-landing-probe:v1 -->",
                "## T-008 landing-page probe — live HTTP observation (not API build status)", "",
                "Run: %s · event `%s` · head `%s`" % (run_url, os.environ["GITHUB_EVENT_NAME"], os.environ.get("PR_HEAD", "")), "",
                "| Repo | Role | URL | HTTP | `<title>` | First `<h1>` | `<meta name=generator>` | Links its `docs/` landing page | `docs/` links | Bytes | SHA-256 (first 12) |",
                "|---|---|---|---|---|---|---|---|---|---|---|"]
          for r in rows:
              esc = lambda s: (s or "—").replace("|", "\\|")
              md.append("| `%s` | %s | <%s> | %s | %s | %s | %s | %s | %d | %s | `%s` |" % (
                  r["repo"], r["role"], r["url"], r.get("status"), esc(r.get("title")), esc(r.get("h1")),
                  esc(r.get("generator")), "yes" if r.get("linksDocsLanding") else "no", len(r.get("docsLinks") or []),
                  r.get("bytes"), (r.get("sha256") or "—")[:12]))
          md += ["", "One GET per URL from a GitHub-hosted runner; JavaScript is not executed. A 200 proves the server returned that document at `checkedAt`; it does not prove rendering, interactivity or use.", "",
                 "<details><summary>Full observation (JSON)</summary>", "", "```json", json.dumps({"runUrl": run_url, "rows": rows}, indent=2, ensure_ascii=False), "```", "", "</details>"]
          open("probe-comment.md", "w", encoding="utf-8").write("\n".join(md) + "\n")
          print("\n".join(md[:20]))
          PY
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Post the observation on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file probe-comment.md
