# T-016: weekly freshness, classification, source-lint and citation checks.
# These audits read the committed snapshot and official GitHub API only; they
# do not regenerate or commit directory data. Findings and incomplete runs are
# preserved as an artifact and tracked in one review issue.
name: Weekly read-only audits

on:
  schedule:
    # Monday at 08:13 UTC, staggered from the daily census and Pages smoke jobs.
    - cron: "13 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-read-only-audits
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual dispatches can select a branch; always audit the public mainline snapshot.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run all four audits against the committed snapshot
        id: audits
        # Keep going so evidence is captured and all four auditors get a turn,
        # even if an earlier one detects a finding or an API access block.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 tools/run_scheduled_audits.py
          --output-dir .work/weekly-audits
          --timeout-seconds 5400

      - name: Retain logs and machine-readable reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-read-only-audit-${{ github.run_id }}
          path: .work/weekly-audits/
          if-no-files-found: error
          retention-days: 30

      - name: Open or update the review issue, or close it after recovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_OUTCOME: ${{ steps.audits.outcome }}
          REVIEW_REQUIRED: ${{ steps.audits.outputs.review_required }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          LABEL="weekly-audit-review"
          ISSUE_TITLE="Weekly read-only audits need review"
          mkdir -p .work/weekly-audits
          gh label create "$LABEL" --color 5319e7 \
            --description "Weekly GitHub API audits reported a finding or incomplete result" --force
          EXISTING="$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')"

          if [[ "$AUDIT_OUTCOME" != "success" || "$REVIEW_REQUIRED" == "true" ]]; then
            {
              echo "Automated review required at $(date -u +%Y-%m-%dT%H:%M:%SZ)."
              echo
              if [[ -s .work/weekly-audits/summary.md ]]; then
                cat .work/weekly-audits/summary.md
              else
                echo "The audit coordinator did not produce a summary. The run is incomplete; no audit may be treated as a pass."
                echo
                echo "Run: $RUN_URL"
              fi
              echo
              echo "Full stdout/stderr logs and captured JSON reports are attached to the workflow run artifact."
              echo "Review the findings against the official sources before changing the snapshot; see [AGENTS.md §4](https://github.com/${GITHUB_REPOSITORY}/blob/main/AGENTS.md)."
              echo
              echo "_This issue is managed by the weekly-read-only-audits workflow. It is updated while review is needed and closed after a clean scheduled/manual run._"
            } > .work/weekly-audits/issue.md

            # Stay comfortably below GitHub's issue-body limit; the full report
            # remains available in the artifact if the summary is very large.
            python3 - <<'PY'
          from pathlib import Path
          path = Path('.work/weekly-audits/issue.md')
          content = path.read_bytes()
          if len(content) > 48000:
              trimmed = content[:46000].decode('utf-8', errors='ignore')
              path.write_text(trimmed + '\n\nTruncated for issue size; see the full evidence artifact linked above.\n', encoding='utf-8')
          PY
            if [[ -n "$EXISTING" ]]; then
              gh issue comment "$EXISTING" --body-file .work/weekly-audits/issue.md
            else
              gh issue create --title "$ISSUE_TITLE" --label "$LABEL" \
                --body-file .work/weekly-audits/issue.md
            fi
          elif [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body "All four scheduled audits completed without review findings at $(date -u +%Y-%m-%dT%H:%M:%SZ). The review issue is closed. Run: $RUN_URL"
            gh issue close "$EXISTING"
          fi

      - name: Fail visibly when a finding or incomplete audit remains
        if: always() && (steps.audits.outcome != 'success' || steps.audits.outputs.review_required == 'true')
        run: |
          echo "At least one audit found a discrepancy/review item or did not complete. See the review issue and workflow artifact."
          exit 1
