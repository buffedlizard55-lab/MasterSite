# Census coverage guard (T-010).
#
# Why this exists: between the 2026-10-01 and 2026-10-11 snapshots the account
# grew from 108 to 146 public repositories and 38 public Pages sites were live
# on the web with no directory entry — nothing compared the live census to the
# published snapshot, so the gap was silent for up to nine days (IRR-131,
# FL-11). This workflow runs that comparison every day and fails loudly.
#
# It only ever needs: the two account profiles + the paginated public repo
# lists + one Pages probe per *missing* repository (normally zero), so it stays
# far inside the authenticated rate limit and never writes to the repository.
#
# T-026 extends the same daily run with a Pages status transition watch
# (tools/pages_status_guard.py): one GET /repos/{owner}/{repo}/pages per
# listed entry, compared against the published pagesStatus, failing on any
# entry that is not live `built` and opening/updating its own issue. Coverage
# ("is every public repository listed?") and build health ("is every listed
# site built?") stay separate verdicts with separate labels — the coverage
# guard costs ~7 requests, the status watch ~150, and together they remain
# well inside the 1,000 requests/hour Actions token ceiling. Nothing here
# ever writes to the repository's data.

name: Census guard

on:
  schedule:
    # Daily at 05:17 UTC — an off-peak minute, staggered from the top of the
    # hour to avoid the scheduled-workload rush.
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the census coverage guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 tools/census_guard.py 2>&1 | tee census-guard-output.txt

      - name: Open or update an issue on failure (loud failure, not a quiet red run)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Re-run capture: the previous step's tee output is on disk only if the
          # guard started; handle the missing-file case too.
          BODY="$(cat census-guard-output.txt 2>/dev/null || echo 'census guard produced no output — see the failed run')"
          {
            echo "The scheduled census guard failed on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo '```'
            echo "$BODY"
            echo '```'
            echo
            echo "Remediation is the documented workflow in [\`AGENTS.md\`](../blob/main/AGENTS.md) §4: curate \`tools/overlay.json\` from each missing repository's own files, then re-run \`tools/build_data.py\`, the audits, \`scripts/validate\` and \`tools/build_verification.py\`."
            echo
            echo "_This issue is managed by the census-guard workflow; it closes itself when the guard passes again._"
          } > issue-body.md
          gh label create "census-gap" --color b60205 --description "Census guard detected unlisted public repositories" 2>/dev/null || true
          EXISTING="$(gh issue list --label census-gap --state open --json number --jq '.[0].number' || true)"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body-file issue-body.md
          else
            gh issue create --title "Census coverage gap: public repositories are missing from the directory" \
              --body-file issue-body.md --label census-gap
          fi

      - name: Close the issue when the guard passes again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          EXISTING="$(gh issue list --label census-gap --state open --json number --jq '.[0].number' || true)"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "Census guard passed on $(date -u +%Y-%m-%dT%H:%M:%SZ): coverage is complete again. Closing."
            gh issue close "${EXISTING}"
          fi

      # --- T-026: Pages status transition watch -------------------------------
      # Runs even when the coverage guard above failed, so one red run still
      # reports both verdicts. The exit code is captured explicitly:
      #   0 = every listed entry is live `built` and matches the snapshot
      #   1 = a real finding (transition / not built / unreadable)
      #   2 = API or environment failure — red run, but never a false finding
      - name: Run the Pages status guard (T-026)
        id: psg
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 tools/pages_status_guard.py 2>&1 | tee pages-status-guard-output.txt
          code=${PIPESTATUS[0]}
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

      - name: Open or update the Pages status issue (T-026)
        if: always() && steps.psg.outputs.code != '' && steps.psg.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          BODY="$(cat pages-status-guard-output.txt 2>/dev/null || echo 'the pages status guard produced no output — see the failed run')"
          {
            echo "The scheduled Pages status watch (T-026) failed on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo '```'
            echo "$BODY"
            echo '```'
            echo
            echo "Each FINDING line carries the exact \`GET /repos/{owner}/{repo}/pages\` endpoint and the UTC read time, so every value can be re-opened by hand. Exit code \`${{ steps.psg.outputs.code }}\`: \`1\` = a transition or an entry that is not live \`built\`; \`2\` = API/rate-limit failure, which is a red run with **no verdict** — re-dispatch the workflow when the limit resets."
            echo
            echo "Remediation is the documented workflow in [\`AGENTS.md\`](../blob/main/AGENTS.md) §4: after a status recovers (or a record goes stale), re-run \`tools/build_data.py\`, the audits, \`scripts/validate\` and \`tools/build_verification.py\` — never hand-edit \`data/sites.js\`. A stalled build (e.g. \`FL-05\`) needs a new push or an owner-initiated rebuild first."
            echo
            echo "_This issue is managed by the census workflow; it closes itself when every listed entry is live \`built\` again._"
          } > pages-status-issue-body.md
          gh label create "pages-status" --color d93f0b --description "Pages status watch: transition or entry not live built (T-026)" 2>/dev/null || true
          EXISTING="$(gh issue list --label pages-status --state open --json number --jq '.[0].number' || true)"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body-file pages-status-issue-body.md
          else
            gh issue create --title "Pages status watch: transition or entry not live built (T-026)" \
              --body-file pages-status-issue-body.md --label pages-status
          fi

      - name: Close the Pages status issue when every entry is built again (T-026)
        if: always() && steps.psg.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          EXISTING="$(gh issue list --label pages-status --state open --json number --jq '.[0].number' || true)"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "Pages status watch passed on $(date -u +%Y-%m-%dT%H:%M:%SZ): every listed entry is live \`built\` and matches the published snapshot. Closing."
            gh issue close "${EXISTING}"
          fi
